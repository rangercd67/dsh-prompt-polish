# dsh-prompt-polish bundle patch: inserts the prompt-enhance plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); install with
# `dsh plugin --profile web add dsh-prompt-polish` (or
# `dsh plugin --profile web add link:<path to this checkout>`).
#
# The row id stays `prompt-enhance` — it is the settings namespace key and
# every existing profile patch targets it; only `name:` follows the package
# name.
#
# One package, both halves: the node half (exports ".") runs in the host
# process and registers the POST /prompt-enhance/enhance route, the
# /enhance slash command, and the "prompt-enhance" settings section; the
# browser half (declared by `dsh.client`, served from lib/client.js) adds
# the composer enhance button (conversation.input.right), the preview
# panel, the undo bar (conversation.input.dock), and the plugin's own
# configuration page (plugins.row.config).
- insert:
    - id: prompt-enhance
      name: dsh-prompt-polish